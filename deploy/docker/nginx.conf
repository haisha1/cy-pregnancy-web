user nginx;
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    access_log off;
    sendfile on;
    server_tokens off;
    keepalive_timeout 30s;

    # 缺失资源和错误不长缓存；带内容哈希的成功资源可以长期缓存。
    map "$status:$uri" $cache_control {
        default "no-store";
        ~^(200|304):/assets/ "public, max-age=31536000, immutable";
    }

    # 宝塔HTTPS入口覆盖转发头，容器内保留外部协议。
    map $http_x_forwarded_proto $external_scheme {
        default $scheme;
        https https;
        http http;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 256k;

        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"UP"}';
        }

        # 运行时解析Docker服务名，后端未启动或重建时不阻止网页容器启动。
        location ^~ /admin/api/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            resolver_timeout 2s;
            set $admin_backend http://admin-api:18732;
            proxy_pass $admin_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_buffering off;
            proxy_cache off;
            error_page 502 504 = @api_unavailable;
        }

        location @api_unavailable {
            default_type application/json;
            return 503 '{"code":"SERVICE_UNAVAILABLE","message":"管理服务暂不可用，请稍后重试","data":null}';
        }

        location = /admin/api { return 404; }
        location ~ ^/(internal|actuator|swagger-ui|swagger-ui.html|v3/api-docs)(/|$) { return 404; }
        location ~ /\. { return 404; }

        location /assets/ {
            try_files $uri =404;
        }

        # 不把丢失的脚本等静态资源当成SPA页面返回。
        location ~* \.(js|css|map|json|png|jpe?g|gif|svg|ico|woff2?|ttf)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
